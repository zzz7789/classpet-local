name: classpet-local
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    ports:
      - "${MYSQL_HOST:-127.0.0.1}:${MYSQL_PORT:-3307}:3306"
    environment:
      MYSQL_DATABASE: classpet
      MYSQL_USER: classpet
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-classpet_local_change_me}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-classpet_root_local_change_me}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci", "--default-time-zone=+00:00"]
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/001-schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
      - ./scripts/mysql-backup.sh:/usr/local/bin/classpet-backup:ro
      - ./scripts/mysql-restore.sh:/usr/local/bin/classpet-restore:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u classpet -p\"$$MYSQL_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: Server=mysql;Port=3306;Database=classpet;User ID=classpet;Password=${MYSQL_PASSWORD:-classpet_local_change_me};Character Set=utf8mb4;DateTimeKind=Utc;
      DataProtection__Path: /data/keys
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - auth_keys:/data/keys
    healthcheck:
      test: ["CMD", "dotnet", "ClassPet.Api.dll", "--healthcheck"]
      interval: 10s
      timeout: 6s
      retries: 20
      start_period: 20s
  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "${APP_HOST:-127.0.0.1}:${APP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 4s
      retries: 5
volumes:
  mysql_data:
  auth_keys:
